    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f7fdff,#eef8fb 52%,#fff)}

    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 22px;border-radius:999px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;text-decoration:none;font-weight:1000}
